<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rielta Detector Portal - Dark Theme Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .bg-card { background-color: #161e2e; }
    .bg-card-hover:hover { background-color: #1d283a; }
    .border-dark { border-color: #2a364f; }
    .bg-navy-900 { background-color: #030712; }
    .bg-navy-800 { background-color: #111827; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVIGATION HEADER -->
  <header class="bg-navy-900 text-white shadow-xl border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <div class="bg-white px-3 py-1.5 rounded-lg flex items-center justify-center shadow">
          <span class="text-blue-900 font-black text-2xl tracking-wider font-sans">RIELTA</span>
        </div>
        <div class="border-l border-gray-700 pl-4">
          <h1 class="font-extrabold text-xl leading-tight text-white tracking-wide">Detector Portal</h1>
          <p class="text-xs text-gray-400">Distributor & Dealer Network</p>
        </div>
      </div>
      
      <!-- USER PROFILE & ADMIN LOGS -->
      <div id="userInfo" class="hidden flex items-center space-x-3">
        <button id="adminLogsBtn" onclick="openLogsModal()" class="hidden text-xs bg-purple-700 hover:bg-purple-600 text-white font-bold px-3.5 py-2 rounded-lg transition shadow flex items-center">
          <i class="fa-solid fa-clock-rotate-left mr-1.5"></i> Login Activity
        </button>

        <span id="roleBadge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-600 text-white shadow"></span>
        <span id="userName" class="text-sm font-semibold text-gray-200"></span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white font-bold px-3.5 py-2 rounded-lg transition shadow">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-card rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-800">
      <div class="text-center mb-8">
        <div class="inline-block bg-blue-900/40 p-4 rounded-full mb-3 border border-blue-500/30">
          <i class="fa-solid fa-shield-halved text-5xl text-blue-400"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-white">Portal Login</h2>
        <p class="text-sm text-gray-400 mt-1">Enter your assigned ID & Password</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-2">Login Email</label>
          <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 text-white outline-none text-base" placeholder="onkarsap05@gmail.com">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-2">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 text-white outline-none text-base" placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-base transition shadow-lg">
          Login to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <main id="dashboardSection" class="hidden flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
    <div class="bg-card p-5 rounded-2xl shadow-lg border border-gray-800 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="flex flex-wrap gap-2.5" id="categoryFilterContainer">
        <button onclick="filterCategory('All')" class="cat-btn px-5 py-2 text-sm font-bold rounded-xl bg-blue-600 text-white shadow">All Detectors</button>
        <button onclick="filterCategory('Ridom')" class="cat-btn px-5 py-2 text-sm font-bold rounded-xl bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700">Ridom</button>
        <button onclick="filterCategory('Wired Detector')" class="cat-btn px-5 py-2 text-sm font-bold rounded-xl bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700">Wired Detectors</button>
        <button onclick="filterCategory('Ladoga- Wireless')" class="cat-btn px-5 py-2 text-sm font-bold rounded-xl bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700">Ladoga- Wireless</button>
        <button onclick="filterCategory('Accessories')" class="cat-btn px-5 py-2 text-sm font-bold rounded-xl bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700">Accessories</button>
      </div>

      <div class="w-full md:w-72 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-base"></i>
        <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search detector model..." class="w-full pl-10 pr-4 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- ADMIN LOGIN LOGS MODAL -->
  <div id="logsModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-card rounded-2xl max-w-4xl w-full p-6 shadow-2xl border border-gray-700 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
        <div>
          <h3 class="font-extrabold text-xl text-white flex items-center">
            <i class="fa-solid fa-users-viewfinder text-purple-400 mr-2.5"></i> Authentication Activity Logs
          </h3>
          <p class="text-xs text-gray-400">Real-time user logins synced with Google Sheets.</p>
        </div>
        <button onclick="closeLogsModal()" class="text-gray-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="logsTableContainer" class="overflow-y-auto flex-1 rounded-xl border border-gray-800 bg-gray-900/60 p-2"></div>
    </div>
  </div>

  <!-- VIDEO POPUP MODAL -->
  <div id="videoModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-card rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl border border-gray-700 relative">
      <div class="p-4 bg-navy-900 text-white flex justify-between items-center border-b border-gray-800">
        <h3 id="modalVideoTitle" class="font-bold text-base">Working Video Demo</h3>
        <button onclick="closeVideoModal()" class="text-gray-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="aspect-video bg-black flex items-center justify-center" id="modalVideoContainer"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/a/macros/rielta.in/s/AKfycbyyxJ30lunkAjAEhcCZgp7isOwg3BswgBuZPLkyEnWlwR61y5mEzD3hcC-RrBtwTS6G/exec";

    let currentUser = null;
    let masterProducts = [];
    let currentCategory = "All";

    function formatINR(val) {
      if (val === undefined || val === null || isNaN(val)) return "₹0.00";
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(val);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Verifying...`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`);
        const result = await res.json();

        if (result.status === "success") {
          currentUser = result.user;
          setupDashboard();
          await loadProducts();
        } else {
          alert(result.message || "Invalid Login Credentials");
        }
      } catch (err) {
        alert("Login Error: Please verify Google Apps Script web app deployment settings.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Login to Dashboard";
      }
    }

    function setupDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('userInfo').classList.remove('hidden');

      document.getElementById('userName').innerText = currentUser.name;
      const badge = document.getElementById('roleBadge');
      badge.innerText = currentUser.role;

      if (currentUser.role === 'admin') {
        badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-purple-600 text-white";
        document.getElementById('adminLogsBtn').classList.remove('hidden');
      } else if (currentUser.role === 'distributor') {
        badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-600 text-white";
        document.getElementById('adminLogsBtn').classList.add('hidden');
      } else {
        badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-600 text-white";
        document.getElementById('adminLogsBtn').classList.add('hidden');
      }
    }

    async function openLogsModal() {
      document.getElementById('logsModal').classList.remove('hidden');
      const container = document.getElementById('logsTableContainer');
      container.innerHTML = `<div class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-purple-400 mb-2"></i><p class="text-sm text-gray-400">Fetching login activity...</p></div>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getLogs&role=${currentUser.role}`);
        const result = await res.json();

        if (result.status === "success" && result.data.length > 0) {
          let rowsHtml = result.data.map(log => `
            <tr class="border-b border-gray-800/60 hover:bg-gray-800/40 text-xs">
              <td class="p-3 text-purple-300 font-mono">${log.timestamp}</td>
              <td class="p-3 text-gray-200 font-bold">${log.name}</td>
              <td class="p-3 text-gray-400">${log.email}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${log.role === 'distributor' ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'bg-blue-950 text-blue-300 border border-blue-500/30'}">${log.role}</span></td>
              <td class="p-3 text-gray-400 font-mono">${log.userId}</td>
            </tr>
          `).join('');

          container.innerHTML = `
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-gray-900 text-gray-400 text-xs uppercase font-bold border-b border-gray-800">
                  <th class="p-3">Timestamp (IST)</th>
                  <th class="p-3">Name</th>
                  <th class="p-3">Email</th>
                  <th class="p-3">Role</th>
                  <th class="p-3">User ID</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          `;
        } else {
          container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">No login logs recorded yet.</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="text-center py-8 text-red-400 text-sm">Failed to load login logs.</div>`;
      }
    }

    function closeLogsModal() {
      document.getElementById('logsModal').classList.add('hidden');
    }

    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = `<div class="col-span-full text-center py-16"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i><p class="text-base text-gray-400">Loading detector catalog from Google Sheets...</p></div>`;

      try {
        const queryParams = `?action=getProducts&role=${currentUser.role}&userId=${encodeURIComponent(currentUser.id)}&userEmail=${encodeURIComponent(currentUser.email)}&userCompany=${encodeURIComponent(currentUser.company || '')}`;
        const res = await fetch(`${SCRIPT_URL}${queryParams}`);
        const result = await res.json();

        if (result.status === "success") {
          masterProducts = result.data;
          renderProducts(masterProducts);
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-400 py-12">Failed to load product catalog. Check Google Apps Script URL.</div>`;
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = "";

      const filtered = products.filter(p => (currentCategory === "All" || p.category === currentCategory));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 text-lg">No detectors found in this category.</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-card rounded-2xl shadow-xl hover:shadow-2xl transition border border-gray-800 overflow-hidden flex flex-col";

        const imgBlock = `
          <div class="relative h-56 bg-slate-900/90 flex items-center justify-center p-5 border-b border-gray-800">
            <img src="${p.image}" alt="${p.name}" class="max-h-full max-w-full object-contain filter drop-shadow-lg" onerror="this.src='https://via.placeholder.com/400x300/1e293b/ffffff?text=Detector+Image'">
            <span class="absolute top-3.5 left-3.5 bg-blue-900/90 text-blue-200 border border-blue-500/30 text-[11px] font-extrabold uppercase tracking-wider px-3 py-1 rounded-lg backdrop-blur-sm shadow">${p.category}</span>
          </div>
        `;

        const featureItems = p.features.map(f => `
          <li class="flex items-start text-sm text-gray-100 font-bold leading-normal">
            <i class="fa-solid fa-circle-dot text-blue-400 mr-2.5 mt-1 text-xs"></i>
            <span>${f}</span>
          </li>
        `).join('');

        let priceBlock = "";
        if (currentUser.role === 'distributor' || currentUser.role === 'admin') {
          const distTierTag = p.isCustomTierPrice ? `<span class="text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-1.5 py-0.5 rounded ml-1 font-bold">Special Rate</span>` : '';
          const dealerTierTag = p.isCustomDealerPrice ? `<span class="text-[9px] bg-blue-500/20 text-blue-300 border border-blue-500/40 px-1.5 py-0.5 rounded ml-1 font-bold">Region Rate</span>` : '';

          priceBlock = `
            <div class="bg-emerald-950/40 border border-emerald-500/30 p-3.5 rounded-xl my-4 grid grid-cols-2 gap-2 text-center">
              <div>
                <p class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">Distributor Rate ${distTierTag}</p>
                <p class="text-xl font-black text-emerald-300 mt-0.5">${formatINR(p.distributorPrice)}</p>
              </div>
              <div>
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Dealer Rate ${dealerTierTag}</p>
                <p class="text-base font-bold text-gray-300 mt-0.5">${formatINR(p.dealerPrice)}</p>
              </div>
            </div>
          `;
        } else {
          priceBlock = `
            <div class="bg-blue-950/40 border border-blue-500/30 p-3.5 rounded-xl my-4 grid grid-cols-2 gap-2 text-center">
              <div>
                <p class="text-[11px] font-bold text-blue-400 uppercase tracking-wider">Your Dealer Rate</p>
                <p class="text-xl font-black text-blue-300 mt-0.5">${formatINR(p.dealerPrice)}</p>
              </div>
              <div>
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">MSRP</p>
                <p class="text-base font-bold text-gray-400 line-through mt-0.5">${formatINR(p.msrp)}</p>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          ${imgBlock}
          <div class="p-6 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-1">
                <h3 class="font-extrabold text-xl text-white tracking-wide">${p.name}</h3>
              </div>
              <p class="text-xs text-blue-400 font-mono mb-4">SKU: ${p.id}</p>
              <ul class="space-y-2 mb-4 bg-gray-900/80 p-3.5 rounded-xl border border-gray-800/80">${featureItems}</ul>
            </div>
            <div>
              ${priceBlock}
              <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-gray-800">
                <button onclick="playVideo('${p.video1.url}', '${p.name} - Demo 1')" class="w-full bg-gray-900 hover:bg-black text-white text-xs py-2.5 px-3 rounded-xl flex items-center justify-center font-bold border border-gray-700 transition">
                  <i class="fa-solid fa-circle-play text-red-500 mr-2 text-base"></i> Demo Video
                </button>
                <button onclick="playVideo('${p.video2.url}', '${p.name} - Tech Guide')" class="w-full bg-gray-900 hover:bg-black text-white text-xs py-2.5 px-3 rounded-xl flex items-center justify-center font-bold border border-gray-700 transition">
                  <i class="fa-solid fa-circle-play text-blue-400 mr-2 text-base"></i> Tech Video
                </button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      renderProducts(masterProducts);
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = masterProducts.filter(p => p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    function playVideo(url, title) {
      if (!url || url.trim() === "") {
        alert("No video URL linked in Google Sheets.");
        return;
      }

      document.getElementById('modalVideoTitle').innerText = title;
      const container = document.getElementById('modalVideoContainer');
      let embedUrl = url.trim();

      if (embedUrl.includes('youtube.com/watch?v=')) {
        const videoId = embedUrl.split('v=')[1].split('&')[0];
        embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
      } else if (embedUrl.includes('youtu.be/')) {
        const videoId = embedUrl.split('youtu.be/')[1].split('?')[0];
        embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
      } else if (embedUrl.includes('youtube.com/shorts/')) {
        const videoId = embedUrl.split('shorts/')[1].split('?')[0];
        embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
      } else if (embedUrl.includes('drive.google.com')) {
        embedUrl = embedUrl.replace(/\/view.*$/, '/preview').replace(/\/edit.*$/, '/preview');
      }

      container.innerHTML = `
        <iframe 
          src="${embedUrl}" 
          class="w-full h-full border-0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      `;
      document.getElementById('videoModal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('videoModal').classList.add('hidden');
      document.getElementById('modalVideoContainer').innerHTML = "";
    }

    function logout() {
      currentUser = null;
      document.getElementById('userInfo').classList.add('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }
  </script>
</body>
</html>
